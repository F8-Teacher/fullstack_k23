<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table width="50%" align="center">
      <tr>
        <td colspan="4">
          <h1 align="center">Novell Services Login</h1>
        </td>
      </tr>
      <tr>
        <td width="40%">
          <label for="username">Username:</label>
        </td>
        <td>
          <input type="text" id="username" />
        </td>
      </tr>
      <tr>
        <td width="40%">
          <label for="password">Password:</label>
        </td>
        <td>
          <input type="password" id="password" />
        </td>
      </tr>
      <tr>
        <td width="40%">
          <label for="city"> City of Employment: </label>
        </td>
        <td>
          <input type="text" id="city" />
        </td>
      </tr>
      <tr>
        <td width="40%">
          <label for="web-server"> Web server: </label>
        </td>
        <td>
          <select id="web-server">
            <option value="">Choose a server</option>
            <option value="Server 1">Server 1</option>
            <option value="Server 2">Server 2</option>
            <option value="Server 3">Server 3</option>
          </select>
        </td>
      </tr>
      <tr>
        <td width="40%">
          <label> Please specify your role: </label>
        </td>
        <td>
          <div>
            <label>
              <input type="radio" name="role" />
              Admin
            </label>
          </div>
          <div>
            <label>
              <input type="radio" name="role" />
              Engineer
            </label>
          </div>
          <div>
            <label>
              <input type="radio" name="role" />
              Manager
            </label>
          </div>
          <div>
            <label>
              <input type="radio" name="role" />
              Guest
            </label>
          </div>
        </td>
      </tr>
      <tr>
        <td width="40%">
          <label> Single Sign-on to the following. </label>
        </td>
        <td>
          <div>
            <label>
              <input type="checkbox" />
              Mail
            </label>
          </div>
          <div>
            <label>
              <input type="checkbox" />
              Payroll
            </label>
          </div>
          <div>
            <label>
              <input type="checkbox" />
              Self-service
            </label>
          </div>
        </td>
      </tr>
      <tr>
        <td></td>
        <td>
          <button>Login</button>
          <button type="reset">Reset</button>
        </td>
      </tr>
    </table>
  </body>
</html>
